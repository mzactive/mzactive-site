<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-en="My Pacer Dashboard | MZ Active" data-ar="لوحة منظّم الوتيرة | MZ Active">لوحة منظّم الوتيرة | MZ Active</title>
<link rel="stylesheet" href="assets/css/site-theme.css?v=20261120h">
<script src="assets/js/api-base.js?v=20261120f"></script>
<script src="assets/js/language-preference.js?v=20261120c"></script>
<script src="assets/js/auth-session.js?v=20261120h"></script>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #091d21; color: #f0f5f3; font: 16px/1.5 Arial, sans-serif; }
  .wrap { width: min(780px, calc(100% - 28px)); margin: auto; padding-block: 14px 36px; }
  .top, .profile-head, .actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .top { margin-block-end: 14px; }
  .top img { display: block; width: 132px; height: auto; }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2rem); }
  h2, h3 { margin: 0 0 4px; }
  p { margin: 4px 0; }
  .card { background: #103538; border: 1px solid #397779; border-radius: 14px; padding: 14px; margin-block: 10px; }
  .profile-status { color: #ffda74; font-weight: 700; }
  .meta { color: #c8ded7; }
  #profileForm { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 12px; }
  #profileForm label { display: grid; gap: 4px; margin: 0; align-content: start; }
  #profileForm > .actions, #profileForm > label:has(textarea), #editStatus { grid-column: 1 / -1; }
  input, textarea { width: 100%; min-width: 0; padding: 8px; border: 1px solid #4d8b8b; border-radius: 8px; background: #091d21; color: #f0f5f3; font: inherit; }
  textarea { min-height: 64px; resize: vertical; }
  .btn, summary { display: inline-flex; align-items: center; min-height: 44px; padding: 7px 12px; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn { border: 0; background: #f2b718; color: #091d21; }
  .top .btn, .btn.secondary { background: #153c3e; border: 1px solid #4d8b8b; color: #f0f5f3; }
  summary { display: list-item; padding-inline: 0; }
  .card details + details, .request + .request { border-block-start: 1px solid #397779; }
  .request { padding-block: 8px; }
  .request .actions { justify-content: flex-start; }
  .paces { display: flex; gap: 4px 14px; flex-wrap: wrap; }
  #editStatus:empty { display: none; }
  :focus-visible { outline: 2px solid #ffd568; outline-offset: 3px; }
  @media (max-width: 520px) { #profileForm { grid-template-columns: 1fr; } }
</style>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-180.png?v=20261120c">
<meta name="apple-mobile-web-app-title" content="MZA">
<script src="/assets/js/pwa-register.js?v=20261128a" defer></script>
</head>
<body class="home-page"><main class="wrap">
  <header class="top">
    <a href="index.html"><img src="assets/brand/mzactive-logo.webp" alt="MZ Active"></a>
    <div class="actions">
      <button type="button" class="btn lang-toggle"><span data-language-label>English</span></button>
      <a class="btn" href="account.html" data-en="Account" data-ar="الحساب">الحساب</a>
      <button type="button" class="btn" id="signout" data-en="Sign out" data-ar="تسجيل الخروج">تسجيل الخروج</button>
    </div>
  </header>
  <h1 data-en="Pacer workspace" data-ar="مساحة المرافق الرياضي">مساحة المرافق الرياضي</h1>
  <p id="notice" class="meta" role="status"></p>
  <a id="applyLink" class="btn" href="/pacer-register.html" hidden data-en="Apply as a Pacer" data-ar="قدّم طلب الانضمام كمرافق">قدّم طلب الانضمام كمرافق</a>
  <div id="pacerContent" hidden>
    <section class="card profile-head" aria-labelledby="pacerName">
      <div><h2 id="pacerName"></h2><p class="meta" id="pacerLocation"></p></div>
      <p class="profile-status" id="pacerStatus"></p>
    </section>
    <details class="card" id="profileEditor">
      <summary data-en="Edit Pacer profile" data-ar="تعديل ملف المرافق">تعديل ملف المرافق</summary>
      <form id="profileForm"><label><span data-en="Availability" data-ar="التاحة">التاحة</span><textarea id="availabilityInput"></textarea></label><label><span data-en="Bio" data-ar="النبذة">النبذة</span><textarea id="bioInput"></textarea></label><label><span data-en="Experience" data-ar="الخبرة">Experience</span><textarea id="experienceInput"></textarea></label><label><span data-en="Achievements" data-ar="الإنجازات">Achievements</span><textarea id="achievementsInput"></textarea></label><label><span data-en="Distances (comma separated)" data-ar="المسافات (مفصولة بفواصل)">Distances</span><input id="distancesInput" placeholder="5K, 10K, Marathon"></label><label><span data-en="Profile photo (optional)" data-ar="الصورة الشخصية (اختياري)">Profile photo</span><input id="pacerPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label><p id="editStatus" role="status"></p><div class="actions"><button class="btn" type="submit" data-en="Save profile" data-ar="حفظ الملف">حفظ الملف</button></div></form>
      <div id="pacesView" class="paces"></div>
    </details>
    <section class="card" id="requests">
      <h2 data-en="Pacing requests" data-ar="طلبات المرافقة">طلبات المرافقة</h2>
      <p id="requestNotice" class="meta" role="status"></p>
      <details id="incomingRequests"><summary data-en="New requests" data-ar="الطلبات الجديدة">الطلبات الجديدة</summary><div id="pendingList"></div></details>
      <details><summary data-en="Accepted requests" data-ar="الطلبات المقبولة">الطلبات المقبولة</summary><div id="acceptedList"></div></details>
      <details><summary data-en="Upcoming events" data-ar="الفعاليات القادمة">الفعاليات القادمة</summary><div id="eventsList"></div></details>
    </section>
  </div>
</main>
<script src="assets/js/site-language.js?v=20261128a"></script>
<script>
const apiBase=window.MZACTIVE_API_BASE||'';
const t=(en,ar)=>document.documentElement.lang==='ar'?ar:en;
const $=id=>document.getElementById(id);
const auth = window.MZActiveAuth;
const token = () => auth.token();
const signIn = '/dashboard.html?next=/pacer-dashboard.html#loginForm';
let profile, requests = [];
const statusLabels = {
  pending: ['Pending review', 'قيد المراجعة'],
  approved: ['Approved', 'معتمد'],
  rejected: ['Not approved', 'لم يُعتمد'],
  suspended: ['Suspended', 'موقوف'],
  received: ['New', 'جديد'],
  accepted: ['Accepted', 'مقبول'],
};
function statusLabel(value) {
  return t(...(statusLabels[value] || ['Pacer profile', 'ملف المرافق']));
}
async function api(path, options = {}) {
  const response = await fetch(apiBase + path, {
    ...options,
    headers: { authorization: 'Bearer ' + token(), ...(options.body ? {'content-type': 'application/json'} : {}) },
  });
  const data = await response.json();
  if (!response.ok) throw Object.assign(new Error(data.error), {status: response.status});
  return data;
}
function goToSignIn() {
  const current = token();
  for (const storage of [sessionStorage, localStorage]) {
    if (storage.getItem(auth.KEY) === current) storage.removeItem(auth.KEY);
  }
  location.replace(signIn);
}
function textNode(tag, value) {
  const node = document.createElement(tag);
  node.textContent = value;
  return node;
}
function requestCard(request, actions) {
  const card = document.createElement('article');
  card.className = 'request';
  card.append(
    textNode('strong', request.event_name || request.service_name || request.goal_summary || t('Pacing request', 'طلب مرافقة')),
    textNode('p', [request.date || request.preferred_date, request.location || request.city, request.distance, request.target_pace].filter(Boolean).join(' · ')),
    textNode('p', statusLabel(request.status)),
  );
  if (actions) {
    const area = document.createElement('div');
    area.className = 'actions';
    for (const [state, label] of [['accepted',t('Accept','قبول')],['declined',t('Decline','رفض')],['completed',t('Complete','إكمال')],['cancelled',t('Cancel','إلغاء')]]) {
      const button = textNode('button', label);
      button.type = 'button';
      button.className = 'btn secondary';
      button.onclick = async () => {
        for (const control of area.children) control.disabled = true;
        try {
          await api('/api/pacer/requests/' + encodeURIComponent(request.id), {method:'PATCH',body:JSON.stringify({status:state})});
          await loadRequests();
        } catch {
          $('requestNotice').textContent = t('Could not update the request. Try again.', 'تعذر تحديث الطلب. حاول مجدداً.');
        } finally {
          for (const control of area.children) control.disabled = false;
        }
      };
      area.append(button);
    }
    card.append(area);
  }
  return card;
}
function renderRequests() {
  const sets = {
    pendingList: requests.filter(q => q.status === 'received'),
    acceptedList: requests.filter(q => q.status === 'accepted'),
    eventsList: requests.filter(q => q.status === 'accepted' && (q.date || q.preferred_date)),
  };
  for (const [id, rows] of Object.entries(sets)) {
    $(id).replaceChildren(...(rows.length ? rows.map(row => requestCard(row, id === 'pendingList')) : [textNode('p',t('None yet.', 'لا توجد عناصر بعد.'))]));
  }
}
async function loadRequests() {
  const response = await api('/api/pacer/requests');
  requests = response.requests || [];
  renderRequests();
}
function renderProfile() {
  $('pacerName').textContent = profile.display_name;
  $('pacerLocation').textContent = [profile.city,profile.country].filter(Boolean).join(' · ');
  $('pacerStatus').textContent = profile.verified ? t('Verified Pacer','مرافق موثّق') : statusLabel(profile.status);
}
async function load() {
  if (!token()) { goToSignIn(); return; }
  try {
    ({profile} = await api('/api/pacer/profile'));
    $('pacerContent').hidden = false;
    $('notice').textContent = '';
    renderProfile();
    for (const key of ['availability','bio','experience','achievements']) $(key + 'Input').value = profile[key] || '';
    $('distancesInput').value = (profile.distances || []).join(', ');
    $('pacesView').replaceChildren(...Object.entries(profile.paces || {}).map(([distance,pace]) => textNode('p', distance + ' · ' + pace)));
  } catch (error) {
    if (error.status === 401) { goToSignIn(); return; }
    if (error.status === 404) {
      $('notice').textContent = t('This account has no Pacer profile yet. You can apply using the same email and password.', 'لا يوجد ملف مرافق لهذا الحساب بعد. يمكنك تقديم طلب باستخدام البريد الإلكتروني وكلمة المرور نفسيهما.');
      $('applyLink').hidden = false;
      return;
    }
    $('notice').textContent = t('Could not open your Pacer profile. Reload to try again.', 'تعذر فتح ملف المرافق. حدّث الصفحة للمحاولة مجدداً.');
    return;
  }
  try {
    await loadRequests();
    if (requests.some(q => q.status === 'received')) $('incomingRequests').open = true;
  } catch {
    $('requestNotice').textContent = t('Could not load pacing requests.', 'تعذر تحميل طلبات المرافقة.');
  }
}
document.addEventListener('mzactive:language-change', () => {
  if (profile) { renderProfile(); renderRequests(); }
});
$('profileForm').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{await api('/api/pacer/profile',{method:'PUT',body:JSON.stringify({availability:$('availabilityInput').value,bio:$('bioInput').value,experience:$('experienceInput').value,achievements:$('achievementsInput').value,distances:$('distancesInput').value.split(',').map(x=>x.trim()).filter(Boolean)})});const photo=$('pacerPhoto').files[0];if(photo){if(photo.size>1000000)throw Error('photo_too_large');const form=new FormData();form.append('photo',photo);const r=await fetch(apiBase+'/api/pacer/profile/photo',{method:'PUT',headers:{authorization:'Bearer '+token()},body:form});if(!r.ok)throw Error('photo_upload_failed');$('pacerPhoto').value='';}$('editStatus').textContent=t('Profile saved.','تم حفظ الملف.');await load();}catch{$('editStatus').textContent=t('Unable to finish saving. Please check your photo and try again.','تعذر إكمال الحفظ. تحقق من الصورة وحاول مجدداً.');}finally{b.disabled=false;}};
$('signout').onclick=async()=>{try{await fetch(apiBase+'/api/auth/logout',{method:'POST',headers:{authorization:'Bearer '+token()}})}catch{}localStorage.removeItem('mzactive-provider-session');sessionStorage.removeItem('mzactive-provider-session');location.assign('/index.html')};
load();
</script>
</body>
</html>
