<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MZ Active articles on running, endurance, sports performance and training."><meta name="theme-color" content="#080909"><title>Blog | MZ Active</title><style>
:root{--bg:#080909;--panel:#131816;--gold:#edb633;--text:#f5f4ef;--muted:#aab1aa;--line:#303832}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 Arial,sans-serif}body.rtl{text-align:right}a{color:inherit;text-decoration:none}.wrap{width:min(980px,92%);margin:auto}header{border-bottom:1px solid var(--line)}header .wrap{min-height:72px;display:flex;align-items:center;justify-content:space-between}.brand img{width:min(170px,36vw)}button,input{font:inherit}.lang-toggle{border:1px solid #80672e;background:transparent;color:var(--gold);padding:8px 12px;font-weight:700;cursor:pointer}.hero{padding:56px 0 35px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:800}.hero h1{font-size:clamp(36px,7vw,64px);line-height:1.05;margin:12px 0}.muted{color:var(--muted)}main{padding:32px 0 64px}.tools{display:flex;gap:12px;margin:20px 0}.tools input{width:min(520px,100%);padding:13px 15px;border:1px solid #444c45;background:#111613;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column}.card h2{font-size:22px;line-height:1.3;margin:10px 0}.card p{color:var(--muted);margin:0 0 18px}.meta{font-size:12px;color:var(--gold)}.btn{display:inline-block;align-self:flex-start;margin-top:auto;padding:10px 14px;background:var(--gold);color:#111;font-weight:800}.empty{padding:22px;border:1px solid var(--line);color:var(--muted)}.article{max-width:780px;margin:auto}.article h1{font-size:clamp(32px,6vw,52px);line-height:1.15}.article .content{margin-top:30px}.content p{margin:18px 0}.content h2,.content h3{color:var(--gold);line-height:1.3;margin:26px 0 12px}.content img{display:block;max-width:100%;height:auto;max-height:620px;object-fit:contain;margin:24px auto;border:1px solid #303832}.content blockquote{border-inline-start:3px solid var(--gold);padding-inline-start:18px;color:#c6c9c3}.back{display:inline-block;color:var(--gold);margin-bottom:18px}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13px}@media(max-width:680px){.grid{grid-template-columns:1fr}.hero{padding:40px 0 26px}}
</style></head><body>
<header><div class="wrap"><a class="brand" href="index.html"><img src="assets/brand/mzactive-logo.webp" alt="MZ Active"></a></div></header>
<section class="hero"><div class="wrap"><div class="eyebrow" data-en="MZ ACTIVE · TRAIN SMART. PERFORM STRONG." data-ar="MZ ACTIVE · تدرب بذكاء. حقق أداءً أقوى.">MZ ACTIVE · TRAIN SMART. PERFORM STRONG.</div><h1 data-en="Running, endurance<br>and performance." data-ar="الجري والتحمل<br>والأداء الرياضي.">Running, endurance<br>and performance.</h1><p class="muted" data-en="Ideas and practical guidance from the MZ Active archive." data-ar="مقالات وإرشادات عملية من أرشيف MZ Active.">Ideas and practical guidance from the MZ Active archive.</p></div></section>
<main class="wrap"><section id="listing"><h2 data-en="Articles" data-ar="المقالات">Articles</h2><div class="tools"><input id="search" type="search" placeholder="Search articles…" aria-label="Search articles"></div><div id="grid" class="grid"></div><p id="empty" class="empty" hidden data-en="No articles match your search." data-ar="لا توجد مقالات تطابق بحثك.">No articles match your search.</p></section><article id="detail" class="article" hidden></article></main>
<footer><div class="wrap"><a href="index.html" data-en="Back to MZ Active" data-ar="العودة إلى موقع MZ Active">Back to MZ Active</a> · MZ ACTIVE</div></footer>
<script>
(()=>{
const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),requested=query.get('article');let posts=[],lang='en';
const grid=$('grid'),empty=$('empty'),listing=$('listing'),detail=$('detail'),search=$('search');
function text(el,tag,value){const n=document.createElement(tag);n.textContent=value||'';el.append(n);return n}
function articleCard(p){const c=document.createElement('article');c.className='card';text(c,'div',p.language==='ar'?'مقال بالعربية':'English article').className='meta';text(c,'h2',p.title);text(c,'p',p.summary);const a=text(c,'a',lang==='ar'?'اقرأ المقال ↗':'Read article ↗');a.className='btn';a.href='blog.html?article='+encodeURIComponent(p.slug);return c}
function matches(p,q){return p.language===lang&&[p.title,p.summary].join(' ').toLowerCase().includes(q)}
function renderList(){grid.replaceChildren();const q=search.value.trim().toLowerCase();const shown=posts.filter(p=>matches(p,q));shown.forEach(p=>grid.append(articleCard(p)));empty.hidden=shown.length>0;}
function inlineText(block,entityMap){const out=document.createDocumentFragment(),str=block.text||'',ranges=[...(block.inlineStyleRanges||[]).map(r=>({...r,kind:'style'})),...(block.entityRanges||[]).map(r=>({...r,kind:'entity'}))],bounds=new Set([0,str.length]);ranges.forEach(r=>{bounds.add(r.offset);bounds.add(Math.min(str.length,r.offset+r.length))});const points=[...bounds].sort((a,b)=>a-b);for(let i=0;i<points.length-1;i++){let v=str.slice(points[i],points[i+1]);if(!v)continue;const active=ranges.filter(r=>r.offset<=points[i]&&r.offset+r.length>=points[i+1]);let node=document.createTextNode(v);for(const r of active){if(r.kind==='style'){const style=String(r.style||'').toLowerCase();if(['bold','italic','underline','code'].includes(style)){const tag=style==='bold'?'strong':style==='italic'?'em':style==='underline'?'u':'code',el=document.createElement(tag);el.append(node);node=el}}else{const ent=entityMap[String(r.key)],href=ent?.data?.href;if(ent?.type==='LINK'&&/^https:\/\//i.test(href||'')){const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.append(node);node=a}}}out.append(node)}return out}
function renderArticle(p){listing.hidden=true;detail.hidden=false;detail.replaceChildren();const back=text(detail,'a',lang==='ar'?'← جميع المقالات':'← All articles');back.className='back';back.href='blog.html';const meta=text(detail,'div',p.language==='ar'?'مقال بالعربية':'English article');meta.className='meta';text(detail,'h1',p.title);if(p.date){const dt=text(detail,'p',new Date(p.date).toLocaleDateString(lang==='ar'?'ar-QA':'en-QA',{year:'numeric',month:'long',day:'numeric'}));dt.className='muted'}const content=text(detail,'div','');content.className='content';let listNode=null,blocks=0;for(const b of p.blocks||[]){const type=b.type||'unstyled';if(type==='atomic'){const key=b.entityRanges?.[0]?.key,entity=p.entityMap?.[String(key)];if(entity?.type==='IMAGE'&&entity.data?.src){const img=document.createElement('img');img.src=entity.data.src;img.alt=p.title;img.loading='lazy';content.append(img)}continue}let tag=type==='header-one'?'h2':type==='header-two'?'h3':type==='blockquote'?'blockquote':'p';if(type==='unordered-list-item'||type==='ordered-list-item'){const needed=type==='ordered-list-item'?'ol':'ul';if(!listNode||listNode.tagName.toLowerCase()!==needed){listNode=document.createElement(needed);content.append(listNode)}const li=document.createElement('li');li.append(inlineText(b,p.entityMap||{}));listNode.append(li);blocks++;continue}listNode=null;const el=document.createElement(tag);el.append(inlineText(b,p.entityMap||{}));content.append(el);blocks++}if(!blocks&&p.summary)text(content,'p',p.summary);document.title=p.title+' | MZ Active';}
search.addEventListener('input',renderList);document.addEventListener('mzactive:language-change',e=>{lang=e.detail.lang;search.placeholder=lang==='ar'?'ابحث في المقالات…':'Search articles…';if(requested){const post=posts.find(p=>p.slug===requested);if(post)renderArticle(post)}else renderList()});
fetch('assets/data/blog-posts.json').then(r=>{if(!r.ok)throw Error('archive_unavailable');return r.json()}).then(data=>{posts=data;if(requested){const p=posts.find(x=>x.slug===requested);if(p)renderArticle(p);else{listing.hidden=false;detail.hidden=true;renderList();empty.hidden=false;empty.textContent=lang==='ar'?'لم نعثر على المقال المطلوب.':'This article could not be found.'}}else renderList()}).catch(()=>{empty.hidden=false;empty.textContent='The article archive is temporarily unavailable.'});
})();
</script><script src="assets/js/site-language.js"></script></body></html>
