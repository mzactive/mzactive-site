name = "mzactive-marketplace-api"
main = "worker.js"
compatibility_date = "2026-11-18"

[vars]
DATA_COLLECTION_ENABLED = "true"
PUBLIC_ORIGINS = "https://mzactive.com,https://www.mzactive.com"

[[d1_databases]]
binding = "DB"
database_name = "mzactive-marketplace-production"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"

[ai]
binding = "AI"

[triggers]
crons = ["0 * * * *"]
