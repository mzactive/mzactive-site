<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fff7e3">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<title>MZ Active · Activity staging</title>
<script src="/app.js" defer></script>
</head>
<body>
<header><strong>MZ ACTIVE</strong><button id="language" type="button">العربية</button></header>
<main>
<section class="intro">
  <h1 data-en="Activity preview" data-ar="معاينة الأنشطة">Activity preview</h1>
  <p data-en="Test workout files, manual logging and the feed. Files and routes stay in this tab." data-ar="جرّب ملفات الحصص والتسجيل اليدوي وعرض الأنشطة. تبقى الملفات والمسارات في هذه الصفحة.">Test workout files, manual logging and the feed. Files and routes stay in this tab.</p>
</section>
<div class="layout">
<section class="card">
  <h2 data-en="Log an activity" data-ar="سجّل نشاطاً">Log an activity</h2>
  <label><span data-en="Import a FIT, GPX or TCX file (up to 8 MB)" data-ar="استورد ملف FIT أو GPX أو TCX (حتى ٨ ميغابايت)">Import a FIT, GPX or TCX file (up to 8 MB)</span><input id="file" type="file" accept=".fit,.gpx,.tcx"></label>
  <form id="manual">
    <label><span data-en="Workout title" data-ar="عنوان الحصة">Workout title</span><input name="title" maxlength="80" required></label>
    <label><span data-en="Sport" data-ar="الرياضة">Sport</span>
      <select name="sport">
        <option value="run" data-en="Running" data-ar="الجري">Running</option><option value="ride" data-en="Cycling" data-ar="الدراجات">Cycling</option>
        <option value="swim" data-en="Swimming" data-ar="السباحة">Swimming</option><option value="triathlon" data-en="Triathlon" data-ar="الترايثلون">Triathlon</option>
        <option value="padel" data-en="Padel" data-ar="البادل">Padel</option><option value="hyrox" data-en="HYROX" data-ar="هايروكس">HYROX</option>
        <option value="crossfit" data-en="CrossFit" data-ar="كروس فت">CrossFit</option><option value="fitness" data-en="Fitness" data-ar="اللياقة">Fitness</option>
        <option value="boxing" data-en="Boxing" data-ar="الملاكمة">Boxing</option><option value="kickboxing" data-en="Kickboxing" data-ar="الكيك بوكسينغ">Kickboxing</option>
        <option value="other" data-en="Other" data-ar="أخرى">Other</option>
      </select>
    </label>
    <div class="metrics">
      <label><span data-en="Minutes" data-ar="المدة بالدقائق">Minutes</span><input name="minutes" type="number" min="1" max="7200" required></label>
      <label><span data-en="Distance (km, optional)" data-ar="المسافة بالكيلومتر (اختياري)">Distance (km, optional)</span><input name="distance" type="number" min="0" max="1000" step=".01"></label>
    </div>
    <label><span data-en="Notes (optional)" data-ar="ملاحظات (اختياري)">Notes (optional)</span><textarea name="notes" maxlength="500" rows="2"></textarea></label>
    <button class="primary" type="submit" data-en="Add activity" data-ar="أضف النشاط">Add activity</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</section>
<section aria-labelledby="feedTitle">
  <header class="feed-header"><h2 id="feedTitle" data-en="Activity feed" data-ar="آخر الأنشطة">Activity feed</h2>
    <button id="sample" type="button" data-en="Load 5,000 sample activities" data-ar="حمّل ٥٠٠٠ نشاط تجريبي">Load 5,000 sample activities</button></header>
  <p id="performance" role="status"></p>
  <div id="feed"></div>
  <button id="more" type="button" data-en="Show more" data-ar="اعرض المزيد" hidden>Show more</button>
</section>
</div>
</main>
</body>
</html>
