<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-en="Become a Pacer | MZ Active" data-ar="انضم كمنظّم وتيرة الجري | MZ Active">انضم كمنظّم وتيرة الجري | MZ Active</title>
<link rel="stylesheet" href="assets/css/site-theme.css?v=20261120h">
<script src="assets/js/api-base.js?v=20261120f"></script>
<script src="assets/js/auth-session.js?v=20261120h"></script>
<script src="assets/js/language-preference.js?v=20261120c"></script>
<style>
body{margin:0;background:#091d21;color:#f0f5f3;font:16px/1.6 Arial,sans-serif}
.wrap{width:min(760px,92%);margin:auto;padding:24px 0 60px}
h1{font-size:clamp(26px,5vw,40px);color:#f2b718;margin:8px 0}
p.lead{color:#b8cbc6;max-width:640px}
.card{background:#103538;border:1px solid #2e6567;border-radius:16px;padding:20px;margin-top:18px}
label{display:grid;gap:6px;margin:12px 0;color:#b8cbc6;font-size:14px}
input,select,textarea{width:100%;padding:12px;border:1px solid #3b7779;border-radius:10px;background:#091d21;color:#f0f5f3;font:inherit}
textarea{min-height:90px}
button{width:100%;min-height:50px;border:0;border-radius:12px;background:#f2b718;color:#091d21;font:inherit;font-weight:900;cursor:pointer}
.status{color:#f2b718;margin-top:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.checks label{display:flex;align-items:center;gap:8px;margin:0}
.checks input{width:20px;height:20px}
.pace-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
@media(max-width:600px){.wrap{padding-inline:14px}.card{padding:14px}}
</style>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-180.png?v=20261120c">
<meta name="apple-mobile-web-app-title" content="MZA">
<script src="/assets/js/pwa-register.js?v=20261121b" defer></script>
</head>
<body>
<div class="wrap">
  <a href="index.html" style="color:#f2b718">MZ Active</a>
  <h1 data-en="Become a Pacer" data-ar="انضم كمنظّم وتيرة الجري">انضم كمنظّم وتيرة الجري</h1>
  <p class="lead" data-en="Independent Pacer registration. Help runners hold a sustainable pace at races and community runs. No coaching certification required." data-ar="تسجيل مستقل لمنظّمي وتيرة الجري. ساعد العدائين على الحفاظ على وتيرة مستدامة في السباقات والجري المجتمعي. لا يشترط شهادة تدريب.">تسجيل مستقل لمنظّمي وتيرة الجري. ساعد العدائين على الحفاظ على وتيرة مستدامة في السباقات والجري المجتمعي. لا يشترط شهادة تدريب.</p>
  <form id="pacerForm" class="card">
    <label><span data-en="Full name" data-ar="الاسم الكامل">الاسم الكامل</span><input id="display_name" required maxlength="100"></label>
    <label><span data-en="Profile photo (JPG, PNG or WebP)" data-ar="صورة الملف (JPG أو PNG أو WebP)">صورة الملف</span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <label><span data-en="Email address" data-ar="البريد الإلكتروني">البريد الإلكتروني</span><input id="email" type="email" required></label>
    <label><span data-en="Password (8+ characters)" data-ar="كلمة المرور (٨ أحرف فأكثر)">كلمة المرور</span><input id="password" type="password" minlength="8" required></label>
    <label><span data-en="Phone number" data-ar="رقم الهاتف">رقم الهاتف</span><input id="phone" type="tel" required></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label><span data-en="Country" data-ar="الدولة">الدولة</span><input id="country" value="Qatar"></label>
      <label><span data-en="City" data-ar="المدينة">المدينة</span><input id="city" required></label>
    </div>
    <label><span data-en="Languages (comma separated)" data-ar="اللغات (يفصل بينها بفاصلة)">اللغات</span><input id="languages" placeholder="Arabic, English"></label>
    <label><span data-en="Short biography" data-ar="نبذة قصيرة">نبذة قصيرة</span><textarea id="bio" required></textarea></label>
    <label><span data-en="Running experience" data-ar="خبرة الجري">خبرة الجري</span><textarea id="experience"></textarea></label>
    <label><span data-en="Previous races and achievements" data-ar="السباقات السابقة والإنجازات">السباقات والإنجازات</span><textarea id="achievements"></textarea></label>
    <fieldset style="border:1px solid #2e6567;border-radius:12px;padding:12px;margin:12px 0">
      <legend data-en="Supported running distances" data-ar="مسافات الجري المدعومة">المسافات المدعومة</legend>
      <div class="checks" id="distances">
        <label><input type="checkbox" value="5K"><span>5K</span></label>
        <label><input type="checkbox" value="10K"><span>10K</span></label>
        <label><input type="checkbox" value="Half Marathon"><span data-en="Half Marathon" data-ar="نصف الماراثون">نصف الماراثون</span></label>
        <label><input type="checkbox" value="Marathon"><span data-en="Marathon" data-ar="الماراثون">الماراثون</span></label>
        <label><input type="checkbox" value="Ultra Running"><span data-en="Ultra Running" data-ar="الجري فائق الطول">الجري فائق الطول</span></label>
        <label><input type="checkbox" value="Community Runs"><span data-en="Community Runs" data-ar="جري المجتمع">جري المجتمع</span></label>
      </div>
    </fieldset>
    <fieldset style="border:1px solid #2e6567;border-radius:12px;padding:12px;margin:12px 0">
      <legend data-en="Sustainable pacing ranges (MM:SS per km)" data-ar="نطاقات الوتيرة المستدامة (د:ث/كم)">نطاقات الوتيرة</legend>
      <div class="pace-grid" id="paces">
        <label><span>5K</span><input data-pace="5K" placeholder="05:30"></label>
        <label><span>10K</span><input data-pace="10K" placeholder="05:35"></label>
        <label><span data-en="Half Marathon" data-ar="نصف الماراثون">نصف الماراثون</span><input data-pace="Half Marathon" placeholder="05:45"></label>
        <label><span data-en="Marathon" data-ar="الماراثون">الماراثون</span><input data-pace="Marathon" placeholder="06:00"></label>
      </div>
    </fieldset>
    <label><span data-en="Availability for races and community runs" data-ar="التاحة للسباقات وجري المجتمع">التاحة</span><input id="availability"></label>
    <label><span data-en="Optional social media and Strava links" data-ar="روابط التواصل و Strava (اختياري)">الروابط</span><input id="social_links" placeholder="https://strava.com/..."></label>
    <label><input id="consent" type="checkbox" required> <span data-en="I consent to the review of my Pacer profile." data-ar="أوافق على مراجعة ملفي كمنظّم وتيرة.">أوافق على المراجعة.</span></label>
    <button type="submit" data-en="Submit Pacer application" data-ar="إرسال طلب الانضمام">إرسال الطلب</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </form>
</div>
<script src="assets/js/site-language.js?v=20261120h"></script>
<script>
const apiBase=window.MZACTIVE_API_BASE||'';
const byId=id=>document.getElementById(id);
const val=id=>byId(id).value.trim();
byId('pacerForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const status=byId('status');status.textContent='...';
  const paces={};document.querySelectorAll('#paces input').forEach(i=>{if(i.value.trim())paces[i.dataset.pace]=i.value.trim()});
  const body={display_name:val('display_name'),email:val('email'),password:val('password'),phone:val('phone'),country:val('country'),city:val('city'),languages:val('languages').split(',').map(x=>x.trim()).filter(Boolean),bio:val('bio'),experience:val('experience'),achievements:val('achievements'),distances:[...document.querySelectorAll('#distances input:checked')].map(i=>i.value),paces,availability:val('availability'),social_links:[val('social_links')].filter(Boolean),consent:byId('consent').checked};
  try{
    const r=await fetch(apiBase+'/api/pacer/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();if(!r.ok)throw Error(d.error||'failed');
    window.MZActiveAuth?.store(d);
    const photo=byId('photo').files[0];
    if(photo){const upload=await fetch(apiBase+'/api/pacer/profile/photo',{method:'PUT',body:photo,headers:{'content-type':photo.type||'image/jpeg',authorization:window.MZActiveAuth?.token?.()||''}});if(!upload.ok){let info={};try{info=await upload.json()}catch{};throw Error(info.error||'photo_upload_failed')}}
    const destination=window.MZActiveAuth?.destination?.(d)||'/providers.html';
    status.innerHTML='';status.append(document.createTextNode(d.status==='pending'?'Application submitted. Your profile is awaiting review. ':'تم الإرسال. '));const link=document.createElement('a');link.href=destination;link.textContent=document.documentElement.lang==='ar'?'افتح مساحتي':'Open my workspace';status.append(link);
  }catch(err){status.textContent=err.message}
});
</script>
</body>
</html>
