<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-en="Become a Pacer | MZ Active" data-ar="انضم كمنظّم وتيرة الجري | MZ Active">انضم كمنظّم وتيرة الجري | MZ Active</title>
<link rel="stylesheet" href="assets/css/site-theme.css?v=20261120h">
<script src="assets/js/api-base.js?v=20261120f"></script>
<script src="assets/js/language-preference.js?v=20261120c"></script>
<style>
body{margin:0;background:#091d21;color:#f0f5f3;font:16px/1.6 Arial,sans-serif}
.wrap{width:min(760px,92%);margin:auto;padding:24px 0 60px}
h1{font-size:clamp(26px,5vw,40px);color:#f2b718;margin:8px 0}
p.lead{color:#b8cbc6;max-width:640px}
.card{background:#103538;border:1px solid #2e6567;border-radius:16px;padding:20px;margin-top:18px}
label{display:grid;gap:6px;margin:12px 0;color:#b8cbc6;font-size:14px}
input,select,textarea{width:100%;padding:12px;border:1px solid #3b7779;border-radius:10px;background:#091d21;color:#f0f5f3;font:inherit}
textarea{min-height:90px}
button{width:100%;min-height:50px;border:0;border-radius:12px;background:#f2b718;color:#091d21;font:inherit;font-weight:900;cursor:pointer}
.status{color:#f2b718;margin-top:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.checks label{display:flex;align-items:center;gap:8px;margin:0}
.checks input{width:20px;height:20px}
.pace-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
@media(max-width:600px){.wrap{padding-inline:14px}.card{padding:14px}}
</style>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-180.png?v=20261120c">
<meta name="apple-mobile-web-app-title" content="MZA">
<script src="/assets/js/pwa-register.js?v=20261121b" defer></script>
<style>
body.pacer-registration:not(.home-page){--bg:#f3f6f3;--text:#17342e;--muted:#526b63;--panel:#fff;--line:#dce4df;background:#f3f6f3!important;color:#17342e!important}
body.pacer-registration *{box-sizing:border-box}body.pacer-registration .wrap{width:min(520px,94%);padding:22px 0 40px}
body.pacer-registration .registration-header{background:#091d21!important;border-radius:14px 14px 0 0;padding:16px 22px} .registration-header img{width:145px;display:block}
.registration-card{background:#fff;padding:24px;border:1px solid #dce4df;border-radius:0 0 14px 14px}.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:800;color:#806022!important}.registration-card h1{line-height:1.15}.registration-card .lead{font-size:14px}.location-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.pacer-registration input:not([type=checkbox]){background:#fff!important;color:#17342e!important;border-color:#cbd9d0!important;color-scheme:light}.consent{display:flex;align-items:flex-start;gap:9px}.consent input{width:18px;height:18px;flex:none}.status{color:#205456!important}.status:empty{display:none}.registration-card a{color:#205456;font-weight:700}
</style></head>
<body class="pacer-registration">
<div class="wrap">
<header class="registration-header"><a href="index.html"><img src="assets/brand/mzactive-logo.webp" alt="MZActive"></a></header>
<main class="registration-card">
<p class="eyebrow" data-en="JOIN MZACTIVE" data-ar="انضم إلى MZActive">JOIN MZACTIVE</p>
<h1 data-en="Become a Pacer" data-ar="انضم كمرافق رياضي">Become a Pacer</h1>
<p class="lead" data-en="Create your account. Complete your sporting profile later." data-ar="أنشئ حسابك وأكمل ملفك الرياضي لاحقاً.">Create your account. Complete your sporting profile later.</p>
<form id="pacerForm">
<label><span data-en="Full name" data-ar="الاسم الكامل">Full name</span><input id="display_name" autocomplete="name" required maxlength="100"></label>
<label><span data-en="Email address" data-ar="البريد الإلكتروني">Email address</span><input id="email" type="email" autocomplete="email" required></label>
<label><span data-en="Password (8+ characters)" data-ar="كلمة المرور (٨ أحرف فأكثر)">Password (8+ characters)</span><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="200" required></label>
<label><span data-en="Phone number" data-ar="رقم الهاتف">Phone number</span><input id="phone" type="tel" autocomplete="tel" required maxlength="40"></label>
<div class="location-grid"><label><span data-en="Country" data-ar="الدولة">Country</span><input id="country" value="Qatar" autocomplete="country-name" required maxlength="80"></label><label><span data-en="City" data-ar="المدينة">City</span><input id="city" autocomplete="address-level2" required maxlength="80"></label></div>
<label class="consent"><input id="consent" type="checkbox" required><span data-en="I consent to processing my application and reviewing my profile before publication." data-ar="أوافق على معالجة طلبي ومراجعة ملفي قبل نشره.">I consent to processing my application and reviewing my profile before publication.</span></label>
<button type="submit" id="submitPacer" data-en="Create my Pacer account" data-ar="أنشئ حسابي كمرافق">Create my Pacer account</button>
<p id="status" class="status" role="status" aria-live="polite" data-user-content></p>
<a id="continueProfile" href="pacer-dashboard.html" hidden data-en="Continue to my profile" data-ar="انتقل إلى ملفي">Continue to my profile</a>
</form>
<p class="lead"><a href="login.html" data-en="Already have an account? Log in" data-ar="لديك حساب؟ سجّل الدخول">Already have an account? Log in</a></p>
</main></div>
<script src="assets/js/site-language.js?v=20261120h"></script>
<script>
const apiBase=window.MZACTIVE_API_BASE||'';
const byId=id=>document.getElementById(id);
const val=id=>byId(id).value.trim();
const t=(en,ar)=>document.documentElement.lang==='ar'?ar:en;
byId('pacerForm').addEventListener('submit',async e=>{
 e.preventDefault();const status=byId('status'),button=byId('submitPacer');button.disabled=true;
 status.textContent=t('Creating your account…','جارٍ إنشاء الحساب…');
 const body={display_name:val('display_name'),email:val('email'),password:byId('password').value,phone:val('phone'),country:val('country'),city:val('city'),consent:byId('consent').checked};
 try{
 const r=await fetch(apiBase+'/api/pacer/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json();if(!r.ok)throw Error(d.error||'failed');
 status.textContent=t('Account created. Sign in to complete your profile. Your application is pending review.','تم إنشاء الحساب. سجّل الدخول لإكمال ملفك. طلبك قيد المراجعة.');
 byId('pacerForm').reset();byId('continueProfile').href='login.html';byId('continueProfile').textContent=t('Sign in to complete my profile','سجّل الدخول لإكمال ملفك');byId('continueProfile').hidden=false;
 }catch(err){status.textContent=err.message==='account_already_exists'?t('This email is already registered. Please sign in.','هذا البريد مسجل بالفعل. يرجى تسجيل الدخول.'):t('Unable to create your account. Please check your details and try again.','تعذر إنشاء الحساب. تحقق من بياناتك وحاول مجدداً.');button.disabled=false;}
});
</script>
</body>
</html>
