  $('revealSave').onclick=()=>{track('save_plan_clicked','click');state.saveRevealed=true;$('saveForm').classList.add('on');$('saveEmail').focus();};
  $('saveForm').onsubmit=async e=>{e.preventDefault();$('saveStatus').textContent=t('results');
    try{if(!token()){const a=await apiCall('/api/auth/register',{method:'POST',body:JSON.stringify({account_type:'member',email:$('saveEmail').value,password:$('savePassword').value,consent:$('saveConsent').checked,display_name:$('saveName').value})});localStorage.setItem(tokenKey,a.token);track('registration_completed','account');}
      await apiCall('/api/run-iq/save',{method:'POST',body:JSON.stringify({assessment:state.assessment,name:$('saveName').value,phone:$('savePhone').value})});track('plan_saved','plan');$('saveStatus').textContent=t('done');await loadMine();}
    catch(err){if(err.status===409)await loadMine();else $('saveStatus').textContent=t('error');}};
  $('raceButton').onclick=async()=>{$('raceStatus').textContent=t('results');try{const d=await apiCall('/api/run-iq/race-result',{method:'POST',body:JSON.stringify({distance:$('actualDistance').value,time:$('actualTime').value,effort:$('actualEffort').value,notes:$('actualNotes').value,target_pace:state.preview?.paces?.targetPace})});$('raceStatus').textContent=t('logged');$('raceOutcome').textContent=d.result.summary+' '+d.result.recovery;}catch{$('raceStatus').textContent=t('error');}};
  document.addEventListener('mzactive:language-change',()=>{renderSteps();if(state.preview)renderResults();renderPlan(state.mine||{shares:[],program:null});renderCoaches();renderFeedback();});
  $('privacyTitle').textContent=t('privacyTitle');$('privacyCopy').textContent=t('privacyCopy');
  renderSteps();renderFeedback();renderCoaches();loadMine();track('page_view',location.pathname);
})();
</script>
<script src="/assets/js/conversion-preview.js?v=1" defer></script></body>
</html>
