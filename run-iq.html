<main>
<section class="hero"><div class="wrap hero-inner"><div class="eyebrow">MZA RUN IQ</div><h1 data-en="Run Smarter. Get Faster." data-ar="اجرِ بذكاء. تصحّ أسرع.">Run Smarter. Get Faster.</h1><p data-en="A simple, private running assessment with clear, explainable pace and goal guidance. Free preview. No account needed." data-ar="تقييم جري بسيط وخاص مع إرشادات واضحة ومفسرة للوتيرة والهدف. نتيجة مجانية دون حساب.">A simple, private running assessment with clear, explainable pace and goal guidance. Free preview. No account needed.</p></div></section>

<section class="section" id="assessment"><div class="wrap">
  <div class="progress"><span id="progressBar"></span></div>
  <div class="step-head"><span id="stepLabel"></span><span id="stepCount"></span></div>

  <div class="panel" id="step1"><h2 id="qGoal"></h2><div class="options" id="goalOptions"></div><div class="fields" style="margin-top:16px"><div class="field" id="distanceField"><label id="distanceLabel"></label><select id="targetDistance"></select></div><div class="field"><label id="targetTimeLabel"></label><input id="targetTime" placeholder="e.g. 50:00 or 2:05:00"></div><div class="field"><label id="raceDateLabel"></label><input id="raceDate" type="date"></div><div class="field full"><label id="customGoalLabel"></label><input id="customGoal" maxlength="300"></div></div></div>
  <div class="panel" id="step2"><h2 id="qAbility"></h2><div class="fields"><div class="field"><label id="freqLabel"></label><select id="frequency"></select></div><div class="field"><label id="kmLabel"></label><input id="weeklyKm" type="number" min="0" max="300" value="15"></div><div class="field"><label id="recentDistanceLabel"></label><input id="recentDistance" placeholder="e.g. 10K"></div><div class="field"><label id="recentTimeLabel"></label><input id="recentTime" placeholder="e.g. 55:00"></div><div class="field"><label id="recentWhenLabel"></label><select id="recentWhen"></select></div><div class="field"><label id="comfortableLabel"></label><input id="comfortablePace" placeholder="e.g. 5:30/km"></div></div><p class="status" id="unknownNote"></p></div>
  <div class="panel" id="step3"><h2 id="qPrefs"></h2><div class="fields"><div class="field full"><label id="daysLabel"></label><div class="days" id="days"></div></div><div class="field"><label id="restHrLabel"></label><input id="restingHr" type="number" min="30" max="120"></div><div class="field"><label id="maxHrLabel"></label><input id="maxHr" type="number" min="120" max="230"></div><div class="field"><label id="cityLabel"></label><input id="city" placeholder="Doha"></div><div class="field full"><label id="limitLabel"></label><textarea id="limitations" maxlength="500"></textarea></div></div></div>
  <div class="nav-buttons"><button class="btn ghost" id="backButton" type="button"></button><button class="btn" id="nextButton" type="button"></button></div>
  <p class="status" id="assessmentStatus" role="status"></p>
</div></section>

<section class="section alt result" id="resultsSection"><div class="wrap" id="results" data-language-skip><h2 id="resultsTitle"></h2><div id="dashboard" class="grid"></div>
  <div class="pace-grid" id="paceCards"></div>
  <h3 id="weekTitle" style="margin-top:22px"></h3><div class="card" id="weekPlan"></div>
  <h3 id="recommendTitle" style="margin-top:22px"></h3><div class="grid" id="adviceCards"></div>
  <div class="card" id="racePrep" style="margin-top:22px"></div>
  <div class="card" id="raceCard" style="margin-top:22px"></div>
  <div class="card" id="postRace" style="margin-top:22px"><h3 id="postRaceTitle"></h3><div class="fields"><div class="field"><label id="actualDistanceLabel"></label><input id="actualDistance" placeholder="10K"></div><div class="field"><label id="actualTimeLabel"></label><input id="actualTime" placeholder="52:30"></div><div class="field"><label id="actualEffortLabel"></label><select id="actualEffort"></select></div><div class="field full"><label id="actualNotesLabel"></label><textarea id="actualNotes" maxlength="500"></textarea></div></div><p class="status" id="raceStatus"></p><button class="btn ghost" id="raceButton" type="button"></button><div id="raceOutcome"></div></div>
</div></section>

<section class="section result" id="signupSection"><div class="wrap"><div class="marketing"><h2 id="savePitchTitle"></h2><p id="savePitchCopy"></p><button class="btn" id="revealSave" type="button"></button>
<form class="save-form" id="saveForm"><div class="fields" style="margin-top:18px"><div class="field"><label id="nameLabel"></label><input id="saveName" autocomplete="name"></div><div class="field"><label id="emailLabel"></label><input id="saveEmail" type="email" autocomplete="email" required></div><div class="field"><label id="passwordLabel"></label><input id="savePassword" type="password" autocomplete="new-password" minlength="12" required></div><div class="field"><label id="phoneLabel"></label><input id="savePhone" type="tel" autocomplete="tel"></div></div><label style="display:block;margin:14px 0"><input id="saveConsent" type="checkbox" required> <span id="consentCopy"></span></label><p class="status" id="saveStatus" role="status"></p><button class="btn" id="saveButton" type="submit"></button></form>
</div></div></section>

<section class="section result" id="planSection"><div class="wrap result" id="planResult"><h2 id="planTitle"></h2><div class="card" id="planSessions"></div><p class="lead" id="planNote"></p></div></section>
<section class="section alt" id="coachSection"><div class="wrap"><h2 id="coachTitle"></h2><p class="lead" id="coachCopy"></p><div class="coach-grid" id="coachGrid"></div></div></section>
<section class="section"><div class="wrap card"><h2 id="privacyTitle"></h2><p class="lead" id="privacyCopy"></p><div id="shareList"></div></div></section>
</main>

    advanced:['Advanced','متقدم'], advancedDesc:['I train consistently, follow structured workouts, or have race experience.','أتدرب باستمرار، وأتبع تمارين منظمة، أو لدي خبرة سباقات.'],
    goalQ:['What would you like to achieve?','ماذا تريد أن تحقق؟'],

    restHr:['Resting heart rate (optional)','معدل نبض الراحة (اختياري)'], maxHr:['Max heart rate (optional)','أقصى معدل نبض (اختياري)'],
    city:['City (optional)','المدينة (اختياري)'], limit:['Anything we should respect? (optional)','هل هناك ما يجب مراعاته؟ (اختياري)'],
    back:['Back','رجوع'], next:['Next','التالي'], results:['See My Results →','عرض نتيجتي →'],
    step:['Step','خطوة'], of:['of','من'],
    resultsTitle:['Your free Run IQ results','نتيجة Run IQ المجانية'],
    summary:['Running level summary','ملخص مستوى الجري'], training:['Current training overview','نظرة على تدريبك الحالي'],
    goal:['Race goal and target pace','هدف السباق والوتيرة المستهدفة'], paces:['Recommended training paces','وتائر التدريب المقترحة'],
    effort:['Heart-rate or effort guide','دليل النبض أو الجهد'], assessment:['Goal assessment','تقييم الهدف'],
    easy:['Easy run','جري سهل'], long:['Long run','جري طويل'], tempo:['Tempo','وتيرة متوسطة'], intervals:['Intervals','فواصل'], target:['Target race pace','وتيرة السباق المستهدفة'],
    talk:['Talk test: you can speak in full sentences.','اختبار الحديث: تستطيع الكلام بجمل كاملة.'],
    priority:['Your Priority','أولويتك'], avoid:['Avoid This','تجنّب هذا'], nextStep:['Next Step','الخطوة التالية'],
    week:['Example weekly plan','خطة أسبوعية توضيحية'], prep:['Before the race','قبل السباق'], paceCard:['Race Day Pace Card','بطاقة وتيرة يوم السباق'],
    splits:['Mathematical splits from your target time','تجزئة حسابية من زمنك المستهدف'], strategy:['Race-day strategy','استراتيجية يوم السباق'], warmup:['Warm-up','الإحماء'],
    postRace:['After the race — record your result','بعد السباق — سجل نتيجتك'], actualDistance:['Actual distance','المسافة الفعلية'], actualTime:['Actual finish time','زمن الإنهاء الفعلي'],
    actualEffort:['Perceived effort','الجهد المدرك'], notes:['Optional notes','ملاحظات اختيارية'], saveResult:['Save race result','حفظ نتيجة السباق'],
    savePitchTitle:['Your next run starts here.','خطوتك التالية تبدأ هنا.'],
    savePitchCopy:['Create your free MZActive account to save your plan, record workouts, track progress and connect with real running coaches.',
      'أنشئ حساب MZ Active مجانياً لحفظ خطتك، وتسجيل التدريبات، وتتبع التقدم، والتواصل مع مدربين حقيقيين.'],
    reveal:['Save My Plan — Free Account','احفظ خطتي — حساب مجاني'],
    name:['Name (optional)','الاسم (اختياري)'], email:['Email','البريد الإلكتروني'], password:['Password (12+ characters)','كلمة المرور (١٢ حرفاً أو أكثر)'], phone:['Phone (optional)','الهاتف (اختياري)'],
    consent:['I agree to store this assessment and plan in my private MZActive account.','أوافق على حفظ هذا التقييم والخطة في حسابي الخاص في MZ Active.'],
    create:['Create free account and save plan →','إنشاء حساب مجاني وحفظ الخطة →'],
    planTitle:['Your plan in the athlete calendar','خطتك في التقويم الرياضي'], planNote:['Open your dashboard to log completed workouts. Planned sessions are not completed until you record them.','افتح لوحة التحكم لتسجيل التدريبات المكتملة. الجلسات المخططة لا تُعد مكتملة حتى تسجلها.'],
    coachTitle:['Real running coaches','مدربو جري حقيقيون'], coachCopy:['Only approved MZActive coaches from the live directory.','مدربون معتمدون من MZ Active من الدليل المباشر فقط.'],
    noCoaches:['No approved running coaches are available yet. Your plan still works on its own.','لا يوجد مدربو جري معتمدون بعد. خطتك تعمل بشكل مستقل.'],
    profile:['View verified profile','عرض الملف الموثق'], request:['Request coaching','طلب تدريب'], share:['Share my report (consent required)','مشاركة تقريري (يتطلب موافقة)'],
    revoke:['Revoke access','إلغاء الوصول'], shared:['Shared with consent','تمت المشاركة بموافقة'], noShare:['No coach has access to your Run IQ data.','لا يوجد مدرب لديه حق الوصول إلى بياناتك.'],
    privacyTitle:['Privacy and safety','الخصوصية والسلامة'],
    privacyCopy:['Your data stays private by default. Nothing is shared with a coach unless you explicitly consent, and you can revoke access anytime. This is educational guidance, not a medical assessment or a replacement for a qualified coach.',
      'تبقى بياناتك خاصة افتراضياً. لا تتم المشاركة إلا بموافقتك الصريحة، ويمكنك إلغاء الوصول في أي وقت. هذا توجيه تعليمي وليس تقييماً طبياً أو بديلاً عن مدرب مؤهل.'],
    error:['The service is temporarily unavailable. Please try again.','الخدمة غير متاحة مؤقتاً. يرجى المحاولة مجدداً.'],
    needGoal:['Choose a goal to continue.','اختر هدفاً للمتابعة.'], needLevel:['Choose a running level to continue.','اختر مستوى جري للمتابعة.'],
    needRace:['Choose a target distance for this goal.','اختر مسافة مستهدفة لهذا الهدف.'],
    done:['Done','تم'], logged:['Race result saved.','تم حفظ نتيجة السباق.'],
  };
  const t = key => L[key]?.[ar() ? 1 : 0] || key;
  const tokenKey = 'mzactive-provider-session';
  const token = () => localStorage.getItem(tokenKey) || sessionStorage.getItem(tokenKey);
  const state = { step:0, level:'', goal:'', assessment:null, preview:null, saveRevealed:false, mine:null };
  const DAYS = [['monday','Mon','إثنين'],['tuesday','Tue','ثلاثاء'],['wednesday','Wed','أربعاء'],['thursday','Thu','خميس'],['friday','Fri','جمعة'],['saturday','Sat','سبت'],['sunday','Sun','أحد']];
  const GOALS = ['start','fitness','distance','finish','time','custom'];
  const fmtPace = s => s ? `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}/km` : '—';
  const range = pair => pair ? `${fmtPace(pair[0])}–${fmtPace(pair[1])}` : '—';

  function option(id, value, icon, title, desc, onSelect, small=false) {
    const el = document.createElement('button'); el.type='button'; el.className='opt'+(small?' small':'');
    el.dataset.value=value; el.innerHTML=`<span class="icon">${icon}</span><b></b><span></span>`;
    el.children[1].textContent=t(title); el.children[2].textContent=t(desc);
    el.onclick=()=>{ onSelect(value); renderSteps(); }; return el;
  }
  function renderSteps() {
    $('progressBar').style.width = ((state.step+1)/4*100)+'%';
    $('stepLabel').textContent=t('step')+' '+(state.step+1); $('stepCount').textContent=t('of')+' 4';
    for(let i=0;i<4;i++)$('step'+i).classList.toggle('on',i===state.step);
    $('backButton').textContent=t('back'); $('backButton').disabled=state.step===0;
    $('nextButton').textContent=state.step===3?t('results'):t('next');
    const levelHost=$('levelOptions'); levelHost.replaceChildren();
    for(const [value,icon,title,desc] of [['beginner','🌱','beginner','beginnerDesc'],['intermediate','🏃','intermediate','intermediateDesc'],['advanced','⚡','advanced','advancedDesc']]){
      const el=option('level',value,icon,title,desc,v=>state.level=v); if(state.level===value)el.classList.add('on'); levelHost.append(el);
    }
    const goalHost=$('goalOptions'); goalHost.replaceChildren();
    for(const [value,icon] of [['start','🌱'],['fitness','💪'],['distance','📏'],['finish','🏁'],['time','⏱️'],['custom','✍️']]){
      const el=option('goal',value,icon,value,value+'Desc',v=>state.goal=v,true);
      el.children[2].textContent=t(value==='start'?'beginnerDesc':value==='fitness'?'fitness':value==='distance'?'distance':value==='finish'?'finish':value==='time'?'time':'custom');
      if(state.goal===value)el.classList.add('on'); goalHost.append(el);
    }
    const raceGoal=['finish','time','custom'].includes(state.goal);
    $('distanceField').hidden=!raceGoal;
    $('targetTime').closest('.field').hidden=!raceGoal;
    $('raceDate').closest('.field').hidden=!raceGoal;
    $('customGoal').closest('.field').hidden=state.goal!=='custom';
    const labels={qLevel:'levelQ',qGoal:'goalQ',qAbility:'abilityQ',qPrefs:'prefsQ',distanceLabel:'goal',targetTimeLabel:'targetTimeLabel',raceDateLabel:'goal',customGoalLabel:'custom',freqLabel:'freq',kmLabel:'km',recentDistanceLabel:'recentDistance',recentTimeLabel:'recentTime',recentWhenLabel:'recentWhen',comfortableLabel:'comfortable',daysLabel:'days',restHrLabel:'restHr',maxHrLabel:'maxHr',cityLabel:'city',limitLabel:'limit',unknownNote:'unknown'};
    for(const [id,key] of Object.entries(labels)) if($(id)) $(id).textContent=t(key);
    $('targetTimeLabel').textContent=t('target');
    $('raceDateLabel').textContent=ar()?'تاريخ السباق (اختياري)':'Race date (optional)';
    $('customGoalLabel').textContent=ar()?'اكتب هدفك':'Write your goal';
    $('unknownNote').textContent=ar()?'لا تعرف وتيرتك؟ لا بأس — سنستخدم الجهد والإحساس.':'Don’t know your pace? No problem — we’ll use effort and talk test.';
    if(!$('frequency').options.length){ for(const v of [1,2,3,4,5,6]){const o=document.createElement('option');o.value=v;o.textContent=v; $('frequency').append(o);} $('frequency').value=3; }
    if(!$('recentWhen').options.length){ for(const [v,k] of [['recent','recent'],['year','recent'],['older','recent'],['never','never'],['unknown','unknown']]){const o=document.createElement('option');o.value=v;o.textContent=t(k); $('recentWhen').append(o);} }
    if(!$('actualEffort').options.length){ for(const v of ['easy','moderate','hard','max']){const o=document.createElement('option');o.value=v;o.textContent=v; $('actualEffort').append(o);} }
    if(!$('targetDistance').options.length){ for(const [v,label] of [['5K','5K'],['10K','10K'],['half','Half Marathon'],['marathon','Marathon'],['custom','Custom']]){const o=document.createElement('option');o.value=v;o.textContent=label; $('targetDistance').append(o);} }
    if(!$('days').children.length){ for(const [value,en,arabic] of DAYS){const label=document.createElement('label');const input=document.createElement('input');input.type='checkbox';input.value=value;if(['monday','wednesday','saturday'].includes(value))input.checked=true;label.append(input,document.createTextNode(ar()?arabic:en));$('days').append(label);} }
  }
  function collect() {
    return { experience:state.level, goal:state.goal,
      target_distance:$('targetDistance').value, custom_distance:$('targetDistance').value==='custom'?$('targetTime').value:'',
      target_time:$('targetTime').value, race_date:$('raceDate').value, custom_goal:$('customGoal').value,
      frequency:Number($('frequency').value), weekly_km:Number($('weeklyKm').value)||0,
      recent_distance:$('recentDistance').value, recent_time:$('recentTime').value, recent_when:$('recentWhen').value,
      comfortable_pace:$('comfortablePace').value, days:[...document.querySelectorAll('#days input:checked')].map(i=>i.value),
      resting_hr:$('restingHr').value, max_hr:$('maxHr').value, limitations:$('limitations').value, city:$('city').value };
  }
  async function apiCall(path, options={}) {
    const headers={'content-type':'application/json',...(options.headers||{})}; if(token())headers.authorization='Bearer '+token();
    const r=await fetch(api+path,{...options,headers}); let d={}; try{d=await r.json();}catch{}
    if(!r.ok)throw Object.assign(new Error(d.error||'request_failed'),{status:r.status}); return d;
  }
  function card(title, body){const el=document.createElement('article');el.className='card';el.append(Object.assign(document.createElement('h3'),{textContent:t(title)}));const content=document.createElement('div');content.innerHTML=body;el.append(content);return el;}
  function renderResults() {
    const p=state.preview;
    $('resultsTitle').textContent=t('resultsTitle');
    const dashboard=$('dashboard'); dashboard.replaceChildren();
    dashboard.append(card('summary',`<p>${p.summary}</p><p>${p.paceAnalysis}</p>`));
    dashboard.append(card('training',`<p>${state.assessment.weekly_km||'—'} km · ${state.assessment.frequency} ${t('freq').toLowerCase()}</p><p>${p.assumptions[0]}</p>`));
    dashboard.append(card('goal',`<p>${p.target}</p><p>${p.raceCard?`${p.raceCard.pace} · ${p.raceCard.targetTime}`:'—'}</p>`));
    dashboard.append(card('effort',`<p>${p.heart.note}</p>${p.heart.easy?`<p>${p.heart.easy.join('–')} bpm · ${p.heart.tempo.join('–')} bpm</p>`:''}`));
    dashboard.append(card('assessment',`<p>${p.goalAssessment.text}</p>`));
    dashboard.append(card('privacyTitle',`<p>${p.assumptions[2]}</p>`));
    const paces=$('paceCards'); paces.replaceChildren();
    for(const [key,pair,note] of [['easy',p.paces.easy,'talk'],['long',p.paces.long,'talk'],['tempo',p.paces.tempo,'talk'],['intervals',p.paces.interval,'talk'],['target',[p.paces.targetPace,p.paces.targetPace],'target']]){
      if(!pair||pair[0]==null||(key==='target'&&!p.paces.targetPace))continue; const el=document.createElement('div');el.className='pace';
      el.append(Object.assign(document.createElement('b'),{textContent:t(key)}),Object.assign(document.createElement('strong'),{textContent:p.paces.targetPace&&key==='target'?fmtPace(p.paces.targetPace):range(pair)}),Object.assign(document.createElement('small'),{textContent:key==='target'?'Calculated from your target time. Desired pace, not validated ability.':t(note)}));paces.append(el);
    }
    $('weekTitle').textContent=t('week'); const week=$('weekPlan');week.replaceChildren();
    for(const s of p.weekPlan||[]){const row=document.createElement('div');row.className='week-row';row.append(Object.assign(document.createElement('b'),{textContent:s.day_key+' · '+s.sport}),Object.assign(document.createElement('span'),{textContent:s.detail}));week.append(row);}
    $('recommendTitle').textContent=t('priority'); const adviceHost=$('adviceCards');adviceHost.replaceChildren();
    for(const item of p.advice||[]){adviceHost.append(card(item.title,`<p>${item.text}</p>`));}
    const prep=$('racePrep');prep.replaceChildren();prep.hidden=!p.racePrep;if(p.racePrep){prep.append(Object.assign(document.createElement('h3'),{textContent:t('prep')}));const ul=document.createElement('ul');for(const item of p.racePrep.items)ul.append(Object.assign(document.createElement('li'),{textContent:item}));prep.append(ul);}
    const cardEl=$('raceCard');cardEl.replaceChildren();cardEl.hidden=!p.raceCard;
    if(p.raceCard){cardEl.append(Object.assign(document.createElement('h3'),{textContent:t('paceCard')}));cardEl.append(Object.assign(document.createElement('p'),{textContent:`${p.raceCard.distance} km · ${p.raceCard.targetTime} · ${p.raceCard.pace}`}));cardEl.append(Object.assign(document.createElement('small'),{textContent:p.raceCard.splitsLabel}));const ul=document.createElement('ul');for(const s of p.raceCard.splits)ul.append(Object.assign(document.createElement('li'),{textContent:`${s.label}: ${s.time} (cumulative ${s.cumulative})`}));cardEl.append(ul);cardEl.append(Object.assign(document.createElement('p'),{textContent:t('strategy')+': '+p.raceCard.strategy}));cardEl.append(Object.assign(document.createElement('p'),{textContent:t('warmup')+': '+p.raceCard.warmup}));}
    $('postRace').hidden=!p.raceCard;
    for(const [id,key] of [['postRaceTitle','postRace'],['actualDistanceLabel','recentDistance'],['actualTimeLabel','recentTime'],['actualEffortLabel','actualEffort'],['actualNotesLabel','notes'],['raceButton','saveResult']])$(id).textContent=t(key);
    $('resultsSection').classList.add('on'); $('signupSection').classList.add('on');
    $('savePitchTitle').textContent=t('savePitchTitle');$('savePitchCopy').textContent=t('savePitchCopy');$('revealSave').textContent=t('reveal');
    for(const [id,key] of [['nameLabel','name'],['emailLabel','email'],['passwordLabel','password'],['phoneLabel','phone'],['consentCopy','consent'],['saveButton','create']])$(id).textContent=t(key);
    $('resultsSection').scrollIntoView({behavior:'smooth',block:'start'});
  }
  function renderPlan(mine){
    const host=$('planSessions');host.replaceChildren();
    for(const s of mine.program?.sessions||[]){const row=document.createElement('div');row.className='week-row';row.append(Object.assign(document.createElement('b'),{textContent:s.session_code+' · '+s.day_key}),Object.assign(document.createElement('span'),{textContent:s.details}),Object.assign(document.createElement('small'),{textContent:s.completed_at?'✓':''}));host.append(row);}
    $('planTitle').textContent=t('planTitle');$('planNote').textContent=t('planNote');
    if(mine.program){$('planSection').classList.add('on');$('planResult').classList.add('on');}
    const shares=$('shareList');shares.replaceChildren();
    if(!(mine.shares||[]).length)shares.textContent=t('noShare');
    for(const s of mine.shares||[]){const row=document.createElement('div');row.className='week-row';row.append(Object.assign(document.createElement('b'),{textContent:s.coach_name+' · '+(s.status==='active'?t('shared'):t('revoke'))}));if(s.status==='active'){const b=Object.assign(document.createElement('button'),{type:'button',className:'btn ghost',textContent:t('revoke')});b.onclick=async()=>{await apiCall('/api/run-iq/share/'+s.coach_user_id,{method:'DELETE'});await loadMine();};row.append(b);}shares.append(row);}
  }
  async function renderCoaches(){const host=$('coachGrid');host.replaceChildren();$('coachTitle').textContent=t('coachTitle');$('coachCopy').textContent=t('coachCopy');
    try{const d=await apiCall('/api/run-iq/coaches?city='+encodeURIComponent($('city').value||''));if(!d.coaches.length){host.textContent=t('noCoaches');return;}
      for(const c of d.coaches){const el=document.createElement('article');el.className='coach';el.append(Object.assign(document.createElement('h3'),{textContent:c.display_name}),Object.assign(document.createElement('p'),{textContent:[c.city,c.country].filter(Boolean).join(', ')}),Object.assign(document.createElement('p'),{textContent:(c.specialties||[]).join(' · ')}));
        const a=Object.assign(document.createElement('a'),{href:c.profile_url,textContent:t('profile')});a.target='_blank';a.rel='noopener noreferrer';
        const b=Object.assign(document.createElement('a'),{href:'pacer.html?provider='+encodeURIComponent(c.id)+'#request',textContent:t('request')});
        const share=Object.assign(document.createElement('button'),{type:'button',className:'btn ghost',textContent:t('share')});share.onclick=async()=>{if(!token()){$('revealSave').click();return;}if(!window.confirm(t('share')))return;await apiCall('/api/run-iq/share',{method:'POST',body:JSON.stringify({coach_user_id:c.id,consent:true})});await loadMine();};
        el.append(a,b,document.createElement('br'),share);host.append(el);}
    }catch{host.textContent=t('error');}}
  async function loadMine(){if(!token())return;try{const d=await apiCall('/api/run-iq/me');state.mine=d;if(d.assessment)renderPlan(d);}catch{}}
  $('nextButton').onclick=async()=>{
    if(state.step===0&&!state.level){$('assessmentStatus').textContent=t('needLevel');return;}
    if(state.step===1&&(!state.goal||(['finish','time','custom'].includes(state.goal)&&!$('targetDistance').value))){$('assessmentStatus').textContent=t(state.goal?'needRace':'needGoal');return;}
    if(state.step<3){state.step++;renderSteps();return;}
    $('assessmentStatus').textContent=t('results');
    try{state.assessment=collect();const d=await apiCall('/api/run-iq/preview',{method:'POST',body:JSON.stringify(state.assessment)});state.preview=d.preview;sessionStorage.setItem('run-iq-assessment',JSON.stringify(state.assessment));renderResults();renderCoaches();$('assessmentStatus').textContent='';}
    catch{$('assessmentStatus').textContent=t('error');}
  };
  $('backButton').onclick=()=>{if(state.step>0){state.step--;renderSteps();}};
  $('revealSave').onclick=()=>{state.saveRevealed=true;$('saveForm').classList.add('on');$('saveEmail').focus();};
  $('saveForm').onsubmit=async e=>{e.preventDefault();$('saveStatus').textContent=t('results');
    try{if(!token()){const a=await apiCall('/api/auth/register',{method:'POST',body:JSON.stringify({account_type:'member',email:$('saveEmail').value,password:$('savePassword').value,consent:$('saveConsent').checked,display_name:$('saveName').value})});localStorage.setItem(tokenKey,a.token);}
      await apiCall('/api/run-iq/save',{method:'POST',body:JSON.stringify({assessment:state.assessment,name:$('saveName').value,phone:$('savePhone').value})});$('saveStatus').textContent=t('done');await loadMine();}
    catch(err){if(err.status===409)await loadMine();else $('saveStatus').textContent=t('error');}};
  $('raceButton').onclick=async()=>{$('raceStatus').textContent=t('results');try{const d=await apiCall('/api/run-iq/race-result',{method:'POST',body:JSON.stringify({distance:$('actualDistance').value,time:$('actualTime').value,effort:$('actualEffort').value,notes:$('actualNotes').value,target_pace:state.preview?.paces?.targetPace})});$('raceStatus').textContent=t('logged');$('raceOutcome').textContent=d.result.summary+' '+d.result.recovery;}catch{$('raceStatus').textContent=t('error');}};
  document.addEventListener('mzactive:language-change',()=>{renderSteps();if(state.preview)renderResults();renderPlan(state.mine||{shares:[],program:null});renderCoaches();});
  $('privacyTitle').textContent=t('privacyTitle');$('privacyCopy').textContent=t('privacyCopy');
  renderSteps();renderCoaches();loadMine();
})();
</script>
</body>
