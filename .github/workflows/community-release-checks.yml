name: Community release checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'community.html'
      - 'dashboard.html'
      - 'providers.html'
      - 'coach.html'
      - 'assets/js/coach-*.js'
      - 'coaches.html'
      - 'assets/css/coach-directory.css'
      - 'pacer.html'
      - 'pacer-register.html'
      - 'pacer-dashboard.html'
      - 'pacer-profile.html'
      - 'assets/js/community-*.js'
      - 'assets/css/community-signup.css'
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/community-release-checks.yml'
permissions:
  contents: read
jobs:
  community-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check assets/js/coach-request-inbox.js
          node --check assets/js/coach-strava-nav.js
          node --check assets/js/community-feed.js
          node --check assets/js/community-social.js
          node --check assets/js/community-public.js
          node --check assets/js/community-groups.js
          node --check assets/js/community-activity-log.js
          node --check backend/activity-log.js
          node --check backend/worker.js
      - name: Static regression tests
        run: npm run test:static
      - name: Backend regression tests
        run: npm run test:backend
