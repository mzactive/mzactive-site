<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>MZ Active Admin</title><script src="assets/js/language-preference.js?v=20261120c"></script><script src="assets/js/api-base.js"></script>
<link rel="stylesheet" href="assets/css/site-theme.css?v=20261120e"><link rel="stylesheet" href="assets/css/admin.css?v=20261120d"><script defer src="assets/js/admin.js?v=20261120d"></script><link rel="manifest" href="/manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png?v=20261120c"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-180.png?v=20261120c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MZA"><meta name="theme-color" content="#091D21"><script src="/assets/js/pwa-register.js?v=20261120e" defer></script></head>
<body><header><div class="bar"><a href="index.html"><img src="assets/brand/mzactive-logo.webp" alt="MZ Active"></a><button id="language"></button><button id="out" hidden data-en="Sign out" data-ar="تسجيل الخروج"></button></div></header>
<main><h1 data-en="Admin command center" data-ar="مركز إدارة المنصة"></h1><p id="notice" role="status"></p>
<form id="login" class="panel"><h2 data-en="Admin sign in" data-ar="دخول المسؤول"></h2>
<label><span data-en="Email" data-ar="البريد الإلكتروني"></span><input name="email" type="email" autocomplete="username" required></label>
<label><span data-en="Password" data-ar="كلمة المرور"></span><span class="password-field"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="loginPassword" data-en="Show" data-ar="إظهار" aria-label="Show password">Show</button></span></label>
<button type="submit" data-en="Sign in" data-ar="دخول"></button><button id="recoverOpen" class="link-button" type="button" data-en="Forgot your password?" data-ar="هل نسيت كلمة المرور؟">Forgot your password?</button></form>
<form id="recover" class="panel" hidden><h2 data-en="Reset admin password" data-ar="إعادة تعيين كلمة مرور المسؤول"></h2>
<p data-en="Use the administrator email and the recovery key held by the account owner. Your old sessions will be signed out." data-ar="استخدم بريد المسؤول ومفتاح الاستعادة الذي يحتفظ به صاحب الحساب. سيتم تسجيل خروج الجلسات القديمة."></p>
<label><span data-en="Administrator email" data-ar="بريد المسؤول"></span><input name="email" type="email" autocomplete="username" required></label>
<label><span data-en="Recovery key" data-ar="مفتاح الاستعادة"></span><input name="key" type="password" autocomplete="off" required></label>
<label><span data-en="New password (12+ characters)" data-ar="كلمة المرور الجديدة (١٢ حرفاً على الأقل)"></span><span class="password-field"><input id="recoverPassword" name="new_password" type="password" minlength="12" autocomplete="new-password" required><button class="password-toggle" type="button" data-password-toggle="recoverPassword" data-en="Show" data-ar="إظهار" aria-label="Show password">Show</button></span></label>
<label><span data-en="Confirm new password" data-ar="تأكيد كلمة المرور الجديدة"></span><input name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></label>
<button type="submit" data-en="Reset password" data-ar="إعادة تعيين كلمة المرور"></button><button id="recoverCancel" class="link-button" type="button" data-en="Back to sign in" data-ar="العودة إلى الدخول">Back to sign in</button></form>
<details id="bootstrap" hidden><summary data-en="Set up first admin" data-ar="إعداد حساب المسؤول الأول"></summary><form id="setup" class="panel">
<label><span data-en="Authorized email" data-ar="البريد المعتمد"></span><input type="email" name="email" required></label>
<label><span data-en="Password (12+ characters)" data-ar="كلمة المرور (١٢ حرفاً على الأقل)"></span><span class="password-field"><input id="setupPassword" type="password" name="password" minlength="12" required><button class="password-toggle" type="button" data-password-toggle="setupPassword" data-en="Show" data-ar="إظهار" aria-label="Show password">Show</button></span></label>
<label><span data-en="Setup key" data-ar="مفتاح الإعداد"></span><input type="password" name="key" required></label><button type="submit" data-en="Create account" data-ar="إنشاء حساب"></button></form></details>
<div id="workspace" hidden><nav id="nav" aria-label="Admin"></nav><h2 id="title" tabindex="-1"></h2><details id="changePasswordPanel"><summary data-en="Change password" data-ar="تغيير كلمة المرور"></summary><form id="changePassword" class="panel">
<label><span data-en="Current password" data-ar="كلمة المرور الحالية"></span><input name="current_password" type="password" autocomplete="current-password" required></label>
<label><span data-en="New password (12+ characters)" data-ar="كلمة المرور الجديدة (١٢ حرفاً على الأقل)"></span><span class="password-field"><input id="changePasswordInput" name="new_password" type="password" minlength="12" autocomplete="new-password" required><button class="password-toggle" type="button" data-password-toggle="changePasswordInput" data-en="Show" data-ar="إظهار" aria-label="Show password">Show</button></span></label>
<button type="submit" data-en="Save new password" data-ar="حفظ كلمة المرور الجديدة"></button></form></details><div id="view"></div></div></main></body></html>
