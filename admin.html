<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">

<link rel="stylesheet" href="assets/css/site-theme.css?v=20261120b"><link rel="stylesheet" href="assets/css/admin.css"><script defer src="assets/js/admin.js"></script><link rel="manifest" href="/manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MZA"><meta name="theme-color" content="#091D21"><script src="/assets/js/pwa-register.js" defer></script></head>
<body><header><div class="bar"><a href="index.html"><img src="assets/brand/mzactive-logo.webp" alt="MZ Active"></a><button id="language"></button><button id="out" hidden data-en="Sign out" data-ar="تسجيل الخروج"></button></div></header>
<main><h1 data-en="Admin command center" data-ar="مركز إدارة المنصة"></h1><p id="notice" role="status"></p>
<form id="login" class="panel"><h2 data-en="Admin sign in" data-ar="دخول المسؤول"></h2>
<label><span data-en="Email" data-ar="البريد الإلكتروني"></span><input name="email" type="email" autocomplete="username" required></label>
<label><span data-en="Password" data-ar="كلمة المرور"></span><input name="password" type="password" autocomplete="current-password" required></label><button type="submit" data-en="Sign in" data-ar="دخول"></button></form>
<details id="bootstrap" hidden><summary data-en="Set up first admin" data-ar="إعداد حساب المسؤول الأول"></summary><form id="setup" class="panel">
<label><span data-en="Authorized email" data-ar="البريد المعتمد"></span><input type="email" name="email" required></label>
<label><span data-en="Password (12+ characters)" data-ar="كلمة المرور (١٢ حرفاً على الأقل)"></span><input type="password" name="password" minlength="12" required></label>
<label><span data-en="Setup key" data-ar="مفتاح الإعداد"></span><input type="password" name="key" required></label><button type="submit" data-en="Create account" data-ar="إنشاء حساب"></button></form></details>
<div id="workspace" hidden><nav id="nav" aria-label="Admin"></nav><h2 id="title" tabindex="-1"></h2><div id="view"></div></div></main></body></html>
